<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 3D Volumetric Depth Filter -->
    <filter id="og3dIconDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" floodColor="#000000" floodOpacity="0.95" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" floodColor="#000000" floodOpacity="0.85" />
    </filter>

    <radialGradient id="ogIconChassisPlate" cx="42%" cy="32%" r="72%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="35%" stopColor="#0F172A" />
      <stop offset="75%" stopColor="#070C18" />
      <stop offset="100%" stopColor="#020408" />
    </radialGradient>

    <linearGradient id="ogIconCyanElectric" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stopColor="#A5F3FC" />
      <stop offset="25%" stopColor="#22D3EE" />
      <stop offset="60%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#083344" />
    </linearGradient>

    <linearGradient id="ogIconVioletElectric" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stopColor="#FDA4AF" />
      <stop offset="20%" stopColor="#F43F5E" />
      <stop offset="55%" stopColor="#C026D3" />
      <stop offset="85%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#312E81" />
    </linearGradient>

    <linearGradient id="ogIconExtrudeWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <linearGradient id="ogIconGlassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.85" />
      <stop offset="30%" stopColor="#FFFFFF" stopOpacity="0.25" />
      <stop offset="65%" stopColor="#38BDF8" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </linearGradient>

    <filter id="ogIconNeonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic App Frame -->
  <rect width="512" height="512" rx="120" fill="#040711" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#1E293B" stroke-width="3" stroke-opacity="0.6" />

  <!-- 3D Extruded Hexagonal Quantum Monolith -->
  <g filter="url(#og3dIconDropShadow)">
    <!-- 3D Extrusion Side Walls (Lower depth) -->
    <path
      d="M 256,48 L 444,148 L 444,356 L 256,456 L 68,356 L 68,148 Z"
      fill="url(#ogIconExtrudeWall)"
      stroke="#000000"
      stroke-width="6"
      transform="translate(0, 24)"
    />
    <path
      d="M 68,356 L 68,380 L 256,480 L 444,380 L 444,356 L 256,456 Z"
      fill="#083344"
      opacity="0.9"
    />

    <!-- Main Front Hexagon Face -->
    <path
      d="M 256,48 L 444,148 L 444,356 L 256,456 L 68,356 L 68,148 Z"
      fill="url(#ogIconChassisPlate)"
      stroke="url(#ogIconCyanElectric)"
      stroke-width="12"
      stroke-linejoin="round"
    />

    <!-- Specular Bevel Highlights -->
    <path
      d="M 68,148 L 256,48 L 444,148"
      stroke="#FFFFFF"
      stroke-width="6"
      stroke-linecap="round"
      stroke-opacity="0.8"
    />

    <!-- Recessed Inner Micro-Hexagon -->
    <path
      d="M 256,84 L 408,166 L 408,338 L 256,420 L 104,338 L 104,166 Z"
      fill="rgba(6, 182, 212, 0.05)"
      stroke="#00F5FF"
      stroke-width="4"
      stroke-dasharray="16 12"
      stroke-opacity="0.6"
      stroke-linejoin="round"
    />

    <!-- Fastener Rivets -->
    <circle cx="256" cy="68" r="8" fill="#67E8F9" />
    <circle cx="424" cy="158" r="8" fill="#67E8F9" />
    <circle cx="424" cy="346" r="8" fill="#67E8F9" />
    <circle cx="256" cy="436" r="8" fill="#67E8F9" />
    <circle cx="88" cy="346" r="8" fill="#67E8F9" />
    <circle cx="88" cy="158" r="8" fill="#67E8F9" />
  </g>

  <!-- 3D "O" Torus Glyph -->
  <g transform="translate(0, -4)">
    <!-- Shadow -->
    <path
      d="M 170,140 C 205,140 234,165 234,200 L 234,302 C 234,337 205,362 170,362 C 135,362 106,337 106,302 L 106,200 C 106,165 135,140 170,140 Z"
      fill="none"
      stroke="#000000"
      stroke-width="42"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
      transform="translate(0, 14)"
    />
    <!-- 3D Body -->
    <path
      d="M 170,140 C 205,140 234,165 234,200 L 234,302 C 234,337 205,362 170,362 C 135,362 106,337 106,302 L 106,200 C 106,165 135,140 170,140 Z"
      fill="none"
      stroke="url(#ogIconCyanElectric)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Specular Highlight -->
    <path
      d="M 116,225 L 116,196 C 116,168 138,147 170,147 C 202,147 224,168 224,196 L 224,245"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
      opacity="0.9"
    />
    <!-- Reactor Core -->
    <circle cx="170" cy="251" r="18" fill="#00F5FF" opacity="0.35" />
    <circle cx="170" cy="251" r="8" fill="#FFFFFF" />
  </g>

  <!-- 3D "G" Kinetic Glyph -->
  <g transform="translate(10, -4)">
    <!-- Shadow -->
    <path
      d="M 372,190 L 372,172 C 372,142 346,124 306,124 C 262,124 238,154 238,198 L 238,306 C 238,346 264,374 306,374 C 348,374 374,348 374,308 L 374,244 L 302,244"
      fill="none"
      stroke="#000000"
      stroke-width="42"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
      transform="translate(0, 14)"
    />
    <!-- 3D Body -->
    <path
      d="M 372,190 L 372,172 C 372,142 346,124 306,124 C 262,124 238,154 238,198 L 238,306 C 238,346 264,374 306,374 C 348,374 374,348 374,308 L 374,244 L 302,244"
      fill="none"
      stroke="url(#ogIconVioletElectric)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Specular Highlight -->
    <path
      d="M 364,172 C 364,150 342,132 306,132 C 270,132 245,158 245,198"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
      opacity="0.9"
    />
    <!-- Laser Cross-Bar -->
    <line x1="306" y1="244" x2="372" y2="244" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Central Quantum Node -->
  <g transform="translate(248, 248)">
    <circle cx="0" cy="0" r="18" fill="#020617" stroke="#22D3EE" stroke-width="6" />
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" />
  </g>

  <!-- Micro "AI" 3D Badge -->
  <g transform="translate(356, 92)">
    <rect x="-6" y="-6" width="94" height="52" rx="16" fill="#020617" stroke="#00F5FF" stroke-width="5" />
    <text x="41" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#A5F3FC" text-anchor="middle" dominant-baseline="middle" letter-spacing="3">AI</text>
  </g>

  <!-- Glass Arc Glare Refraction -->
  <path
    d="M 96,148 C 176,94 336,94 416,148 C 336,200 176,200 96,148 Z"
    fill="url(#ogIconGlassGlare)"
    opacity="0.8"
    pointer-events="none"
  />
</svg>
